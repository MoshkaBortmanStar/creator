[project]
name = "openspec-driver"
version = "0.5.1"
description = "OpenSpec Change Driver — конвейер MAIN → proposal → spec-bdd → tasks → code"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
]

# Команда, которая появляется в PATH после установки.
# Движок находит проект сам — по .agent/config.yaml вверх от текущего каталога.
[project.scripts]
openspec = "openspec_driver.cli:main_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openspec_driver"]

# data/ (schema.yaml, templates/, шаблон config.yaml, скилл opencode) лежит
# ВНУТРИ пакета, поэтому попадает в колесо вместе с ним — отдельный
# force-include не нужен и ломает сборку дублем путей.
