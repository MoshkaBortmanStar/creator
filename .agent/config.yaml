# ============================================================
# OpenSpec Change Driver — глобальные настройки проекта
# ============================================================

# ============================================================
# ⚠ ВСЯ СЕКЦИЯ project_context МЕНЯЕТСЯ ОТ ПРОЕКТА К ПРОЕКТУ.
# Движок дженерик: язык, фреймворки и структуру каталогов он берёт
# ОТСЮДА. Скопировал .agent/ в новый проект — первым делом правь это,
# иначе кодогенерация напишет код не на том языке и не в ту папку.
# ============================================================
project_context:
  # Стек проекта. Уходит в промпт КАЖДОГО шага, а для кодогенерации
  # определяет язык, расширения файлов и тестовые библиотеки.
  # Примеры:
  #   "Java 17, Spring Boot 3.x, Maven, JUnit 5, MockMvc"
  #   "Kotlin, Android SDK, Jetpack Compose, Room, JUnit + Robolectric"
  #   "Python 3.12, FastAPI, SQLAlchemy, pytest"
  tech_stack: "Java 17, Spring Boot 3.x, Maven, JUnit 5, MockMvc"

  # Договорённости команды: архитектурный стиль, правила коммитов, линтеры.
  # Модель следует этому при генерации кода — пиши то, что реально важно.
  code_style: "Conventional Commits, интерфейсы для контроллеров (API-first)"

  # Базовый пакет / неймспейс. Java, Kotlin — "com.example";
  # Python/JS — имя корневого модуля.
  base_package: "com.example"

  # Корень исходников относительно корня проекта — КУДА кодогенерация
  # положит файлы. Зависит от структуры сборки, не от языка:
  #   Maven/Gradle одномодульный  → "src"
  #   Android (модуль app)        → "app/src/main/java"
  #   Python                      → "src" или имя пакета
  source_root: "src"

# ============================================================
# ПРОВАЙДЕР: выбирается ОДНОЙ строкой ниже
# ============================================================
# Активный профиль — единственный источник base_url / model / ключа.
# Поменял эту строку — сменился провайдер во всём конвейере сразу.
# Разово на один запуск, не трогая файл:  --profile <name>
#
# Профиль обязателен. Если его не указать, движок упадёт с явной ошибкой,
# а не уедет молча на чужой хост: дефолтов у base_url и model нет намеренно.
active_profile: "glm"

profiles:
  glm:                                   # Z.AI Coding Plan (основной)
    # ВАЖНО: у Coding Plan свой endpoint — /api/coding/paas/v4.
    # Обычный /api/paas/v4 — это pay-as-you-go, ключ подписки там не работает.
    base_url: "https://api.z.ai/api/coding/paas/v4"
    model: "glm-5.3"

    # Ключ ТОЛЬКО через переменную окружения — в репозиторий он не попадает:
    #   export ZAI_API_KEY="..."          (положи в ~/.zshenv)
    #
    # Почему не сюда: этот файл уходит в git. Секрет в истории коммитов
    # остаётся навсегда, даже если убрать его из текущей версии файла.
    # Движок откажется работать, если найдёт здесь api_key.
    api_key_env: "ZAI_API_KEY"
    verify_ssl: true

  local:                                 # локальная модель на своей машине
    # Ollama: ollama serve + ollama pull qwen2.5-coder:7b
    # Работает без сети и без ключа. Медленнее и слабее — годится,
    # когда нет интернета или не хочется тратить лимит подписки.
    base_url: "http://localhost:11434/v1"
    model: "qwen2.5-coder:7b"
    verify_ssl: true

# ============================================================
# Параметры запроса, НЕ зависящие от провайдера
# ============================================================
# Хоста, модели и ключа здесь быть не должно — они живут в профиле.
ai_settings:
  temperature: 0.2
  max_tokens: 30000

  # Таймаут в потоковом режиме считается МЕЖДУ кусками ответа, а не на
  # весь ответ — длинная генерация по нему не оборвётся.
  timeout_seconds: 600

  # Потоковый режим: имена файлов печатаются по мере генерации, видно
  # что процесс идёт. false — обычный запрос (весь ответ разом; тогда
  # timeout_seconds применяется ко всей генерации и может оборвать её).
  stream: true

  # Произвольные параметры, уходящие в тело запроса к API КАК ЕСТЬ.
  # Движок их не интерпретирует — просто подмешивает в payload, поэтому
  # опции конкретного провайдера добавляются правкой конфига, без кода.
  #
  # Действуют на ВСЕ шаги конвейера. Отдельно для кодогенерации — секция
  # code_generation.extra_params ниже: спека и код это разные задачи,
  # при проектировании размышления модели полезны, при генерации кода
  # по готовому плану они только жгут общий с ответом max_tokens.
  #
  # Раскомментируй нужное:
  #
  # extra_params:
  #   # GLM (Z.AI): отключить фазу размышлений. Думающие модели тратят
  #   # весь max_tokens на reasoning и возвращают пустой ответ — на
  #   # кодогенерации по готовой спеке думать почти не над чем.
  #   thinking:
  #     type: "disabled"          # "enabled" — вернуть размышления
  #
  #   # OpenAI o-серия: глубина рассуждений
  #   reasoning_effort: "low"     # low | medium | high
  #
  #   # Общие параметры сэмплинга
  #   top_p: 0.9
  #   presence_penalty: 0.0
  #   frequency_penalty: 0.0
  #
  #   # Детерминированная выдача там, где провайдер это поддерживает
  #   seed: 42

pipeline:
  # Создавать ли отдельную git-ветку spec/<change-id> при команде --new
  isolate_git_branch: false

  # Если у изменения нет своего worktree — создавать его автоматически
  # перед кодогенерацией. Кодоген всегда идёт в изоляции, даже если при
  # --new про --worktree забыли.
  # Разовое отключение: флаг --here (генерировать в текущей директории).
  auto_worktree: true

  # Сообщение коммита спеки. Движок коммитит папку specs/<id> перед созданием
  # worktree, и в проектах с хуком commit-msg (semantic-release,
  # semantic-gradle-plugin) формат сообщения обязан быть по Conventional Commits,
  # иначе коммит отклоняется и worktree не создаётся.
  #
  # Плейсхолдер {change_id} подставляется движком.
  # По умолчанию: "docs(spec): {change_id}"
  #
  # spec_commit_message: "chore(spec): {change_id}"

  # Локальные файлы вне git — копируются в новый worktree при создании.
  # Они в .gitignore, поэтому сами туда не попадают, и сборка падает
  # не из-за кода, а из-за окружения. Зависит от стека:
  #   Android → ["local.properties"]      (путь к SDK)
  #   Node    → [".env", ".env.local"]
  #   Python  → [".env"]
  # Пути относительно корня проекта; отсутствующие молча пропускаются.
  worktree_copy: []

code_generation:
  # Сначала падающий тест (TDD), затем реализация
  test_first: true

  # Команда прогона тестов ПОСЛЕ записи файлов. Меняется от проекта
  # к проекту вместе со стеком:
  #   Maven   → "mvn -q test"
  #   Gradle  → "./gradlew test"
  #   Python  → "pytest -q"
  #   Node    → "npm test"
  # Пустая строка или отсутствие ключа — тесты не запускаются.
  # Разовое отключение: флаг --no-test.
  #
  # ВАЖНО: команда должна покрывать ВЕСЬ код, который кодоген мог тронуть.
  # Что не компилируется в этой команде — ломается незаметно: движок увидит
  # нулевой код возврата, отрапортует «тесты зелёные» и закоммитит.
  # Если часть тестов нельзя выполнить в этой среде (нужно устройство,
  # внешняя БД, сеть) — добавь хотя бы их КОМПИЛЯЦИЮ, она обычно дешёвая:
  #   Android → "./gradlew test compileDebugAndroidTestKotlin"
  #   Maven   → "mvn -q test-compile test"
  test_command: "mvn -q test"

  # Если изменение живёт в своём worktree и тесты позеленели — движок
  # сам коммитит результат, чтобы в основном проекте было что мерджить.
  # Разовое отключение: флаг --no-commit.

  # Сколько задач из tasks.md брать в ОДИН запрос к модели.
  #   0  — весь план одним запросом (быстро, но на длинных планах модель
  #        обрывает файлы или молча пропускает задачи)
  #   3–4 — рекомендуется: каждый батч пишет файлы сразу, следующий получает
  #        уже созданные файлы как контекст
  # Разовое переопределение: флаг --batch N.
  batch_size: 3

  # Файлы сборки — передаются модели с актуальным содержимым, чтобы она
  # могла САМА добавить недостающую зависимость и выдать файл целиком.
  # Меняется от проекта к проекту вместе со стеком:
  #   Maven   → ["pom.xml"]
  #   Gradle  → ["gradle/libs.versions.toml", "app/build.gradle.kts"]
  #   Python  → ["pyproject.toml"] или ["requirements.txt"]
  #   Node    → ["package.json"]
  dependency_files:
    - "pom.xml"

  # Карта существующего кода в промпт каждого батча: путь файла + объявления
  # верхнего уровня (классы, интерфейсы, функции), без тел. Дёшево: на проекте
  # из 40 файлов выходит ~1000 токенов.
  #
  # Зачем: без карты модель видит только спеку, план и файлы, созданные ею же
  # в текущем прогоне. Код прошлых изменений для неё не существует — и она
  # создаёт дубли сущностей, вторую точку входа, параллельные пакеты поверх
  # уже написанного. Особенно на длинных планах, где бюджет контекста
  # вытесняет ранее созданные файлы.
  #
  # project_map_roots — где искать код. По умолчанию source_root;
  # перечисли явно, если исходники и тесты лежат в разных корнях.
  project_map: true
  project_map_roots:
    - "src"

  # Модель ТОЛЬКО для кодогенерации — переопределяет профиль на этом шаге.
  #
  # Зачем: спеку и код пишут разные по характеру модели. Думающая хороша
  # на проектировании, но на кодогенерации тратит общий с ответом
  # max_tokens на размышления и может вернуть ПУСТОЙ ответ.
  #
  # У Z.AI это лечится через extra_params ниже (thinking: disabled).
  # Но если шлюз игнорирует параметр — помогает только смена модели
  # на кодер, он не размышляет вовсе.
  #
  # model: "glm-4.6"

  # Лимит ответа только для кодогенерации (по умолчанию из ai_settings).
  # max_tokens: 30000

  # Параметры запроса ТОЛЬКО для кодогенерации — накладываются поверх
  # ai_settings.extra_params. Типичный случай: у думающей модели оставить
  # размышления на спеках и отключить на коде.
  #
  # extra_params:
  #   thinking:
  #     type: "disabled"
