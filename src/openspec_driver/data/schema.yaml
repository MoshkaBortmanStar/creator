name: spec-driven-change-pipeline
version: 1.1.0
description: >-
  Жесткий конвейер проектирования изменений:
  MAIN Spec -> Промпт -> Proposal -> BDD Spec -> Tasks -> Code

# Главная (мейн) спека проекта — НЕ привязана к изменению.
# Описывает: что за приложение, зачем, какой стек и архитектура.
# Подмешивается в контекст каждого шага конвейера автоматически.
project_spec:
  generates: "specs/MAIN.md"
  description: >-
    Мейн-спека проекта: что за приложение, зачем оно, стек, архитектура,
    текущие возможности (Capabilities) и конвенции.
  rules:
    - "Секции: What Is This App, Tech Stack, Architecture, Capabilities, Conventions"
    - "Стек согласовывать с .agent/config.yaml (project_context)"
    - "Capabilities пополняются по мере реализации изменений (change-*)"
    - "Обновлять при изменении фундамента приложения (стек, домен, архитектура)"

# Порядок артефактов = порядок конвейера.
# generates  — путь к файлу относительно корня проекта ({change_id} подставляется скриптом).
# requires   — какие артефакты должны существовать перед генерацией этого.
# rules      — правила, которые скрипт передаёт LLM вместе с системным промптом.

artifacts:
  - id: proposal
    generates: "specs/{change_id}/proposal.md"
    description: >-
      Инициация изменения. Зачем, что меняется, какие новые возможности
      (Capabilities).
    rules:
      - "Максимум 100 слов"
      - "Фокус на 'Зачем', а не 'Как'"
      - "Секции: Why, What Changes, New Capabilities"

  - id: spec-bdd
    generates: "specs/{change_id}/spec-bdd.md"
    requires: [proposal]
    description: >-
      Перевод бизнес-требований в строгие BDD сценарии
      и OpenAPI-контракты.
    rules:
      - "Использовать строгий синтаксис GIVEN - WHEN - THEN"
      - "Описать все краевые случаи (валидация, ошибки 400, 500)"
      - "Каждому сценарию присвоить ID (S1, S2, ...)"
      - "Включить секцию OpenAPI Delta (изменения paths/schemas)"

  - id: tasks
    generates: "specs/{change_id}/tasks.md"
    requires: [spec-bdd]
    description: Декомпозиция реализации на атомарные технические шаги.
    rules:
      - "Каждая задача должна занимать не более 2 часов"
      - "Первой задачей всегда идёт генерация/запуск падающего теста"
      - "Каждая задача: чек-бокс + ID связанных сценариев + затрагиваемые файлы"

  - id: code-generation
    requires: [tasks, spec-bdd]
    description: >-
      Исполнение задач и генерация целевого кода проекта.
      Файлы записываются в исходники; сырой ответ LLM на диск
      не сохраняется.
